api_version: openclaw.skill/v1
kind: Skill
metadata:
  id: ai-video-reverse-replica-assistant
  display_name: AI视频反推与复刻助手
  version: 1.0.0
  language: zh-CN
  tags:
    - video-analysis
    - storyboard
    - prompt-engineering
    - dreamina
spec:
  entrypoint: system_prompt.md
  output_schema: output_schema.json
  modes:
    - replicate
    - variation
    - enhance
  required_inputs:
    - video_input.type
    - video_input.value
    - user_intent.mode
  optional_inputs:
    - user_intent.description
    - edit_instruction.scene
    - edit_instruction.character
    - edit_instruction.style
    - edit_instruction.action
    - edit_instruction.emotion
  deliverables:
    - 角色设定表
    - 完整分镜表
    - 结构拆解
    - 元提示词模板
    - 验证测试
    - 提示词替换指南
    - JSON结果
  compatibility:
    upload_target: OpenClaw Skill Registry
    runtime: llm-agent
